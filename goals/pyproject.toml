[project]
name = "goals-tracker"
version = "0.1.0"
description = "Пятница: monthly goals tracker with daily check-ins and rewards"
requires-python = ">=3.11"
dependencies = []  # stdlib only

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
goals = "goals_app.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["goals_app"]

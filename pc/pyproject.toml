[project]
name = "jarvis-pc"
version = "0.1.0"
description = "Пятница: personal assistant on top of OpenJarvis (Claude + Telegram + Android bridge)"
requires-python = ">=3.11,<3.14"
dependencies = [
    # OpenJarvis (Apache 2.0, https://github.com/open-jarvis/OpenJarvis), pinned.
    "openjarvis[inference-cloud]==1.0.4",
    "python-telegram-bot>=22.8",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
friday = "jarvis_pc.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jarvis_pc"]
